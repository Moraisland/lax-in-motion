name: Publish LAX in Motion
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Extract the approved website
        run: |
          unzip -q site-source.zip -d extracted
          test -f extracted/lax-in-motion/docs/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: extracted/lax-in-motion/docs
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
